<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Submission Form</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="form-wrapper">
            <h1>Submit Your Information</h1>
            <form id="dataForm">
                <div class="form-group">
                    <label for="name">Name:</label>
                    <input 
                        type="text" 
                        id="name" 
                        name="name" 
                        placeholder="Enter your name"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="email">Email:</label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        placeholder="Enter your email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="message">Message:</label>
                    <textarea 
                        id="message" 
                        name="message" 
                        placeholder="Enter your message"
                        rows="5"
                        required
                    ></textarea>
                </div>

                <button type="submit" class="btn-submit">Submit</button>
            </form>

            <div id="errorMessage" class="error-message" style="display: none;"></div>

            <div class="data-list">
                <h2>Submitted Data</h2>
                <div id="dataContainer" class="data-container"></div>
                <button id="refreshBtn" class="btn-refresh">Refresh Data</button>
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById('dataForm');
        const errorMessage = document.getElementById('errorMessage');
        const dataContainer = document.getElementById('dataContainer');
        const refreshBtn = document.getElementById('refreshBtn');

        // Handle form submission
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // Clear error message
            errorMessage.style.display = 'none';
            errorMessage.textContent = '';

            const formData = {
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                message: document.getElementById('message').value
            };

            try {
                const response = await fetch('/api/submit', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(formData)
                });

                if (response.ok) {
                    // Redirect to success page
                    window.location.href = '/success';
                } else {
                    const errorData = await response.json();
                    showError(errorData.error || 'An error occurred during submission');
                }
            } catch (error) {
                showError('Failed to connect to server: ' + error.message);
            }
        });

        // Show error message
        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.style.display = 'block';
        }

        // Fetch and display data
        async function loadData() {
            try {
                const response = await fetch('/api/list');
                if (response.ok) {
                    const data = await response.json();
                    displayData(data);
                } else {
                    console.error('Failed to fetch data');
                }
            } catch (error) {
                console.error('Error fetching data:', error);
            }
        }

        // Display data in table format
        function displayData(data) {
            dataContainer.innerHTML = '';
            
            if (!data || data.length === 0) {
                dataContainer.innerHTML = '<p>No data available</p>';
                return;
            }

            const table = document.createElement('table');
            table.className = 'data-table';
            
            // Create table header
            const thead = document.createElement('thead');
            const headerRow = document.createElement('tr');
            const headers = ['Name', 'Email', 'Message', 'Submitted At'];
            
            headers.forEach(header => {
                const th = document.createElement('th');
                th.textContent = header;
                headerRow.appendChild(th);
            });
            
            thead.appendChild(headerRow);
            table.appendChild(thead);

            // Create table body
            const tbody = document.createElement('tbody');
            data.forEach(item => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${escapeHtml(item.name)}</td>
                    <td>${escapeHtml(item.email)}</td>
                    <td>${escapeHtml(item.message)}</td>
                    <td>${item.createdAt ? new Date(item.createdAt).toLocaleString() : 'N/A'}</td>
                `;
                tbody.appendChild(row);
            });
            
            table.appendChild(tbody);
            dataContainer.appendChild(table);
        }

        // Escape HTML to prevent XSS
        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, m => map[m]);
        }

        // Refresh button event listener
        refreshBtn.addEventListener('click', loadData);

        // Load data on page load
        window.addEventListener('DOMContentLoaded', loadData);
    </script>
</body>
</html>
